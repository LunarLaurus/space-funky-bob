name: B.O.B. ROM Analysis Tests

on:
  push:
    branches: [main, develop, 'feature/**']
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        python-version: ['3.8', '3.9', '3.10', '3.11', '3.12']

    steps:
    - uses: actions/checkout@v4

    - name: Set up Python ${{ matrix.python-version }}
      uses: actions/setup-python@v5
      with:
        python-version: ${{ matrix.python-version }}

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install pytest pytest-cov
        if [ -f requirements.txt ]; then pip install -r requirements.txt; fi

    - name: Run pytest suite (tests/)
      run: |
        python -m pytest tests/ -v --tb=short

    - name: Run full test suite
      run: |
        python run_full_test_suite.py

    - name: Run property tests
      run: |
        python property_tests.py --suite property --limit 100

    - name: Run extraction tests
      run: |
        python test_extraction.py

    - name: Run graphics tests
      run: |
        python test_graphics.py

    - name: Generate coverage report
      run: |
        pytest tests/ --cov=toolkit --cov-report=xml --cov-report=term-missing

    - name: Upload coverage to Codecov
      uses: codecov/codecov-action@v4
      with:
        file: ./coverage.xml
        flags: unittests
        fail_ci_if_error: false

  lint:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.11'

    - name: Install lint tools
      run: |
        python -m pip install --upgrade pip
        pip install flake8 black

    - name: Check Python syntax
      run: |
        python -m py_compile toolkit/bob_lz.py
        python -m py_compile toolkit/bob_lz_encode.py
        python -m py_compile toolkit/bob_lz_scan.py
        python -m py_compile toolkit/bob_map.py
        python -m py_compile toolkit/bob_graphics.py
        python -m py_compile toolkit/bob_extract.py
        python -m py_compile toolkit/bob_extract_levels.py
        python -m py_compile toolkit/bob_inject.py
        python -m py_compile toolkit/bob_analyze.py
        echo "All Python files compile successfully"

    - name: Run Flake8 linting
      run: |
        flake8 toolkit/ tests/ --max-line-length=100 --ignore=E501,W503

    - name: Check Black formatting
      run: |
        black --check toolkit/ tests/ --line-length=100
